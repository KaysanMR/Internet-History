<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Jost:ital,wght@0,100..900;1,100..900&family=Koulen&display=swap" rel="stylesheet">
    <title>Internet History</title>
    <script src="scripts/script.js" defer></script>

<body>
    <header class="grid">
        <h1 class="koulen"><a href="./index.html">Internet History</a></h1>
        <nav class="plex">
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
    </header>
    
    <main class="grid">
      <h1 class="formHeader">Let's get in touch!</h1>
      <form id="contactForm" onsubmit="return validateForm()">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" />
        <span class="error" id="nameError"></span>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Your email" />
        <span class="error" id="emailError"></span>

        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="Subject" />
        <span class="error" id="subjectError"></span>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Your message"></textarea>
        <span class="error" id="messageError"></span>

        <input type="submit" value="Submit" />
      </form>
    </main>
    <footer>
      <p>
        Kaysan M. Rifath | TP078588 | 
        <a href="mailto:kaysanmr@gmail.com">kaysanmr@gmail.com</a>
      </p>
    </footer>
</body>
</html>
